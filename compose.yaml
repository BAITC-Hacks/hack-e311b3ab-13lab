name: hattama

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://hattama:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/hattama
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-hattama}
  MINIO_SECURE: "false"
  DATA_DIR: /app/data
  BOT_SERVICE_URL: http://meeting-bot:8100

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Runs once before the API: schema migrations, storage bucket, admin and team accounts.
  migrate:
    build: ./backend
    command: ["python", "-m", "scripts.migrate"]
    env_file: .env
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file: .env
    environment: *backend-environment
    volumes:
      - app-tmp:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped


  # Joins Google Meet, Teams and Zoom web clients as a participant. Internal only.
  meeting-bot:
    build: ./services/meeting-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BOT_MAX_SESSIONS: ${LIVE_MAX_SESSIONS:-2}
      BOT_DEBUG: ${BOT_DEBUG:-0}
    volumes:
      - ./secrets:/secrets
      - ./bot-debug:/debug
    shm_size: 1gb
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hattama
      POSTGRES_USER: hattama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hattama -d hattama"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app-tmp:
  postgres:
  minio:
